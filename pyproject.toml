[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NicheBridge"
version = "0.0.1"
description = "Spatial molecular integration, deconvolution and generative diffusion transport"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "anndata>=0.9",
    "torch>=2.0", "scikit-learn>=1.2", "networkx>=3.0", "scanpy>=1.9",
]
keywords = ["spatial-transcriptomics", "deconvolution", "multi-omics", "diffusion-bridge"]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]
tutorial = [
    "anndata>=0.11", "matplotlib>=3.7", "nbformat>=5", "nbclient>=0.8",
    "ipykernel>=6", "jupyterlab>=4", "gseapy>=1.0", "statsmodels>=0.14",
    "h5py>=3.8", "pillow>=9",
]
reproduction = ["anndata>=0.11", "matplotlib>=3.7", "h5py>=3.8", "igraph>=0.11", "leidenalg>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nichebridge*"]
